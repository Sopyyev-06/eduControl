# eduControl — production-oriented stack
#   cp .env.example .env  &&  fill secrets  &&  docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-educontrol}
      MYSQL_USER: ${DB_USER:-educontrol}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    volumes:
      - db_data:/var/lib/mysql
    networks: [internal, edge]
    ports:
      - "127.0.0.1:3307:3306"   # dev only — local npm run dev üçin; production-da aýyryň
    # no ports: -> the database is NOT reachable from the host/internet
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 1g }

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-educontrol}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-educontrol}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PII_KEY: ${PII_KEY:?set PII_KEY in .env}
      PII_KEY_VERSION: ${PII_KEY_VERSION:-1}
      ACCESS_TTL_SEC: ${ACCESS_TTL_SEC:-900}
      REFRESH_TTL_SEC: ${REFRESH_TTL_SEC:-43200}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      COOKIE_SECURE: "false"
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    networks: [internal, edge]
    expose: ["4000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 512m }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    expose: ["8080"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "${HTTP_PORT:-8080}:80"
      # - "443:443"   # enable after you add certificates
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [edge, internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  edge:
  internal:
    internal: true   # backend/db traffic never leaves the compose network
